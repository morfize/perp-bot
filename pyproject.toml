[project]
name = "perp-bot"
version = "0.1.3"
description = "Hyperliquid mean-reversion perpetual futures trading bot"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "morfize" },
]
keywords = ["hyperliquid", "trading", "perpetuals", "crypto", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "hyperliquid-python-sdk",
    "websockets",
    "pandas",
    "numpy",
    "eth_account",
    "python-dotenv",
    "pyyaml",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
perpbot = "perp_bot.cli:main"

[project.urls]
Homepage = "https://github.com/morfize/perp-bot"
Repository = "https://github.com/morfize/perp-bot"
Issues = "https://github.com/morfize/perp-bot/issues"
Changelog = "https://github.com/morfize/perp-bot/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/perp_bot"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/__pycache__",
    "/dist",
    "/main.pyc",
    "/scratch.py",
]
